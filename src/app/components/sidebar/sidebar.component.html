<aside class="sidebar">
    <button class="compose-btn" (click)="composeService.open()">
        <i class="fa-solid fa-pen-to-square"></i>
        Scrie email
    </button>

    <button class="section-label" (click)="toggleFolders()">
        <span>Foldere</span>
        <i class="fa-solid fa-chevron-down chevron" [class.rotated]="foldersExpanded()"></i>
    </button>


    <div class="dropdown-container" [class.open]="foldersExpanded()">

        @for (folder of folders; track folder.id) {

        <button class="folder-item" [class.active]="activeFolder() === folder.id" (click)="selectFolder(folder.id)">
            <i class="icon" [class]="folder.icon"></i>
            <span class="label">{{ folder.label }}</span>
            @if (folder.count) {
            <span class="badge">{{ folder.count }}</span>
            }

        </button>
        }
    </div>




    <button class="section-label" (click)="toggleLabels()">
        <span>Etichete</span>
        <i class="fa-solid fa-chevron-down chevron" [class.rotated]="labelsExpanded()"></i>
    </button>

    <div class="dropdown-container" [class.open]="labelsExpanded()">
        @for (label of labels; track label.id) {
        <button class="folder-item" [class.active]="activeLabel() === label.id" (click)="selectLabel(label.id)">
            <span class="label-dot" [style.background]="label.color"></span>
            <span class="label">{{ label.name }}</span>
        </button>
        }
    </div>


</aside>
